const ASESORES = {
  marilyn: {
    nombre:'Marilyn', rol:'Líder Comercial B2B', color:'#1A1FBE', emoji:'👩‍💼', pin:'7392',
    auditoria:{
      diagnostico:'Es el perfil comercial más listo para liderar la presencia B2B: tiene titular claro, experiencia en Impresionante, antecedente en BBVA, formación administrativa y publicaciones recientes. Debe pasar de posts generales a autoridad comercial con casos, criterios de compra y conversaciones con decisores.',
      titular:'Ejecutiva Comercial B2B en Impresionante del Sureste | Branding corporativo, impresión y publicidad visual para empresas',
      acercaDe:'Ayudo a empresas del sureste a fortalecer su visibilidad mediante branding corporativo, impresión, publicidad visual e instalación publicitaria.\n\nTrabajo con negocios que necesitan comunicar mejor, verse más profesionales y convertir sus espacios físicos en puntos de contacto con sus clientes.\n\nMi enfoque es comercial y consultivo: entender el objetivo, recomendar la solución adecuada y acompañar el proceso para que cada material visual tenga una función clara.\n\nConectemos si trabajas en marketing, compras, administración o desarrollo comercial y buscas mejorar la presencia visual de tu marca.',
      experiencia:'- Ejecutiva de cuentas B2B - Impresionante del Sureste: asesoría comercial para proyectos de branding corporativo, impresión, publicidad visual y comunicación física.\n- Agregar bullets medibles: sectores atendidos, tipos de proyectos, coordinación con producción, seguimiento a cotizaciones y acompañamiento al cliente.\n- BBVA: convertir la experiencia financiera en confianza comercial: atención, análisis de necesidades, seguimiento y relación con clientes.',
      habilidades:['Ventas B2B','Branding corporativo','Publicidad visual','Impresión digital','Desarrollo comercial','Atención a clientes','Prospección','Negociación','CRM','Compras B2B','Comunicación visual','Marketing B2B','Administración','Seguimiento comercial','Customer experience'],
      destacados:'1) Post de publicidad visual como inversión.\n2) Caso real de Impresionante explicado.\n3) PDF/checklist: cómo elegir proveedor de publicidad visual.',
      red:'Conectar cada semana con 15 perfiles: gerentes de marketing, compras, administración, dueños de PyME, restaurantes, hoteles, escuelas y agencias.',
      prioridad:'Mantener 3 posts por semana y comentar en publicaciones de decisores 10 minutos al día.',
      checklist:['Foto de perfil: rostro claro, buena luz, fondo limpio, encuadre profesional','Banner con promesa B2B: Comunicación visual para empresas del sureste','Titular: rol + problema que resuelve + categoría','Acerca de: 4 bloques en primera persona sin sonar a folleto','Experiencia: 3-5 bullets con funciones y resultados cualitativos','Destacado: 3 piezas fijadas (post autoridad, caso/proyecto, recurso útil)','Actividad constante y comentar en clientes potenciales','Habilidades alineadas al rol con validaciones','2-3 recomendaciones reales de cliente, compañero y responsable de proyecto','URL pública limpia, ciudad correcta, empresa vinculada'],
      reglas:['No publicar el mismo copy en todos los asesores','3 a 5 hashtags ultra-específicos','No vender agresivamente, priorizar valor y criterio','Sin enlaces externos en el cuerpo del post','Responder comentarios con respuestas humanas, no solo gracias','Evitar engagement artificial','Usar fotos reales cuando existan','Priorizar carruseles PDF 6-9 láminas y videos nativos menos de 30 segundos','Gancho fuerte en las primeras dos líneas antes de ver más']
    },
    posts:[
      {sem:1,dia:'Martes',hora:'9:00 AM',copy:'Una buena publicidad visual no solo debe verse bien.\n\nTambién debe cumplir una función de negocio:\n\n- atraer atención,\n- comunicar con claridad,\n- orientar al cliente,\n- generar confianza,\n- y ayudar a vender.\n\nCuando una empresa invierte en impresión, señalética o branding corporativo sin un objetivo claro, corre el riesgo de comprar solo "material".\n\nCuando lo hace con estrategia, la publicidad deja de ser un gasto y se convierte en una herramienta de crecimiento.\n\nEn Impresionante del Sureste ayudamos a empresas a transformar sus espacios físicos en puntos de contacto con sus clientes.'},
      {sem:1,dia:'Miércoles',hora:'10:00 AM',copy:'En ventas B2B, he aprendido que el cliente no siempre busca "una lona", "un vinil" o "una impresión".\n\nMuchas veces busca algo más profundo:\n\n- que su negocio se vea profesional,\n- que su marca sea recordada,\n- que su sucursal comunique confianza,\n- que una campaña salga a tiempo,\n- que el proveedor no le falle.\n\nPor eso la publicidad visual debe venderse como una solución, no como una pieza suelta.\n\nLa pregunta correcta no es solo:\n\n"¿Qué medida necesita?"\n\nLa pregunta correcta es:\n\n"¿Qué necesita lograr tu marca con este material?"'},
      {sem:1,dia:'Jueves',hora:'9:00 AM',copy:'Cada proyecto de publicidad visual tiene una pregunta detrás:\n\n¿Cómo hacemos que esta marca se vea mejor, se entienda más rápido y conecte con sus clientes?\n\nLa respuesta no siempre está en imprimir más.\n\nA veces está en:\n\n- elegir mejor el material,\n- ordenar el mensaje,\n- mejorar la ubicación,\n- cuidar la instalación,\n- mantener consistencia con la marca.\n\nEn Impresionante del Sureste trabajamos para que cada pieza visual tenga una función clara.\n\nPorque cuando la comunicación visual está bien pensada, la marca no solo se ve: se entiende.'},
      {sem:2,dia:'Martes',hora:'9:00 AM',copy:'Elegir un proveedor de publicidad visual no debería depender solo del precio.\n\nEn proyectos B2B, también importa:\n\n1. Que entienda el objetivo de la marca.\n2. Que recomiende materiales adecuados.\n3. Que pueda cumplir tiempos.\n4. Que cuide la calidad de impresión.\n5. Que tenga criterio para instalación.\n6. Que dé seguimiento después de entregar.\n\nUna cotización barata puede parecer atractiva.\n\nPero si el material falla, el color no corresponde o la instalación queda mal, el costo real termina siendo mayor.\n\nEn comunicación visual, el proveedor también cuida la reputación de tu marca.'},
      {sem:2,dia:'Miércoles',hora:'10:00 AM',copy:'La publicidad visual se vuelve gasto cuando se improvisa.\n\nSe vuelve inversión cuando tiene objetivo.\n\nNo es lo mismo imprimir por urgencia que imprimir con una estrategia clara:\n\n- qué mensaje debe comunicar,\n- a quién debe atraer,\n- dónde se va a colocar,\n- cuánto tiempo debe durar,\n- qué acción debe provocar.\n\nLa pregunta no es:\n\n"¿Cuánto cuesta imprimir?"\n\nLa pregunta es:\n\n"¿Qué oportunidad puede abrir esta comunicación visual?"'},
      {sem:2,dia:'Jueves',hora:'9:00 AM',copy:'En compras B2B, elegir proveedor no es solo comparar precios.\n\nTambién es reducir riesgos.\n\nRiesgo de retraso.\nRiesgo de mala calidad.\nRiesgo de instalación deficiente.\nRiesgo de que la marca se vea diferente a lo planeado.\nRiesgo de tener que repetir el trabajo.\n\nPor eso, una buena compra de publicidad visual debe considerar calidad, tiempos, materiales, asesoría e instalación.\n\nEl proveedor correcto no solo entrega un producto.\n\nTambién ayuda a que la marca se vea como debe verse.'},
      {sem:3,dia:'Martes',hora:'9:00 AM',copy:'El branding corporativo no termina en el logo.\n\nTambién se expresa en los espacios físicos:\n\n- fachadas,\n- recepciones,\n- cristales,\n- muros,\n- vehículos,\n- señalética,\n- exhibidores,\n- materiales promocionales.\n\nCada uno de esos puntos puede fortalecer o debilitar la percepción de una marca.\n\nCuando una empresa cuida su presencia visual, transmite orden, confianza y profesionalismo.\n\nLa comunicación visual es parte de la experiencia de marca.'},
      {sem:3,dia:'Miércoles',hora:'10:00 AM',copy:'Mi experiencia en el sector financiero me dejó una lección que hoy aplico en ventas B2B:\n\nla confianza se construye con claridad.\n\nUn cliente necesita entender:\n\n- qué está contratando,\n- qué problema resuelve,\n- qué opciones tiene,\n- qué riesgos existen,\n- qué resultado puede esperar.\n\nCuando hay claridad, hay más confianza.\n\nY cuando hay confianza, la relación comercial cambia.'},
      {sem:3,dia:'Jueves',hora:'9:00 AM',copy:'Un buen caso de publicidad visual se puede explicar con tres preguntas:\n\n1. ¿Qué necesitaba comunicar la marca?\n2. ¿Dónde debía verse?\n3. ¿Qué solución visual ayudaba mejor?\n\nCuando esas tres respuestas están claras, el proyecto deja de ser solo impresión.\n\nSe convierte en una solución de comunicación.\n\nEn Impresionante del Sureste trabajamos con empresas que buscan verse mejor, comunicar con más claridad y fortalecer su presencia en el mercado.'},
      {sem:4,dia:'Martes',hora:'9:00 AM',copy:'Una campaña visual debería empezar con un objetivo.\n\nNo con el material.\n\nPrimero hay que definir:\n\n- qué queremos comunicar,\n- a quién queremos llegar,\n- dónde se va a ver,\n- qué acción esperamos,\n- cuánto tiempo debe durar,\n- qué imagen debe proyectar la marca.\n\nDespués viene la decisión de formato.\n\nCuando se empieza por el objetivo, el material se elige mejor.\n\nY el resultado tiene más sentido para el negocio.'},
      {sem:4,dia:'Miércoles',hora:'10:00 AM',copy:'Una marca se construye en cada detalle.\n\nEn el logo, sí.\n\nPero también en:\n\n- el color impreso,\n- la claridad del mensaje,\n- la calidad del material,\n- la instalación,\n- la fachada,\n- la señalética,\n- el vehículo,\n- el punto de venta.\n\nCada pieza visual puede fortalecer la confianza o debilitarla.\n\nCuando una empresa invierte en publicidad visual, está cuidando la forma en que el mercado la percibe.'},
      {sem:4,dia:'Jueves',hora:'9:00 AM',copy:'Este mes he confirmado algo:\n\nla comunicación visual tiene un papel muy importante en el crecimiento de una empresa.\n\nNo solo porque ayuda a verse mejor.\n\nSino porque ayuda a:\n\n- generar confianza,\n- ordenar mensajes,\n- destacar en el mercado,\n- comunicar promociones,\n- orientar clientes,\n- fortalecer la presencia de marca.\n\nEn Impresionante del Sureste seguiremos compartiendo ideas, casos y aprendizajes.'}

      titular:'Ejecutiva de Ventas B2B en Impresionante del Sureste | Ayudo a empresas a ganar visibilidad con publicidad visual, impresión e instalación estratégica',
      acercaDe:'Ayudo a empresas a fortalecer su presencia de marca mediante soluciones de publicidad visual, impresión e instalación.\n\nMi trabajo es acompañar a negocios que buscan verse más profesionales, destacar frente a su competencia y comunicar mejor en sus espacios físicos.\n\nMe interesa conectar con empresas que quieren convertir fachadas, puntos de venta, promociones y materiales impresos en herramientas reales de visibilidad.\n\nSi tu marca necesita ser más clara, visible y recordable, podemos conversar.',
      experiencia:'- Ejecutiva de ventas - Impresionante del Sureste: asesoría para proyectos de publicidad visual, impresión, posicionamiento y visibilidad de marca.\n- Administrador de cuenta - DTS Tornillos y Suspensiones: funciones comerciales, seguimiento de clientes, cuentas y atención.\n- Agregar ejemplos de sectores atendidos: retail, restaurantes, escuelas, eventos, servicios y negocios locales.',

      destacados:'1) Post sobre marcas visibles.\n2) Checklist antes de cotizar publicidad.\n3) Caso simple: de necesidad del cliente a solución visual.',

      checklist:['Foto de perfil: rostro claro, buena luz, fondo limpio','Banner con promesa B2B y servicios clave','Titular: rol + problema + categoría','Acerca de: 4 bloques en primera persona','Experiencia con bullets de funciones y resultados','Destacado: 3 piezas fijadas','Actividad constante y comentar en clientes potenciales','Habilidades alineadas con validaciones','2-3 recomendaciones reales','URL pública limpia y datos profesionales consistentes'],
      reglas:['No publicar el mismo copy que los demás asesores','3 a 5 hashtags específicos por post','Priorizar valor sobre venta directa','Sin enlaces externos en el cuerpo del post','Responder comentarios con profundidad','Usar fotos reales cuando existan','Carruseles PDF y videos nativos menos de 30 segundos','Gancho fuerte en primeras dos líneas']

    posts:[
      {sem:1,dia:'Martes',hora:'9:00 AM',copy:'Las marcas que logran destacar no lo hacen por casualidad.\n\nDetrás de una empresa visible normalmente hay decisiones muy concretas:\n\n- dónde aparece la marca,\n- qué mensaje repite,\n- cómo se ve frente a su competencia,\n- qué tan fácil es reconocerla,\n- qué confianza transmite en sus espacios físicos.\n\nEn publicidad visual, cada pieza comunica algo.\n\nUna marca visible es una marca con más oportunidades.'},
      {sem:1,dia:'Miércoles',hora:'10:00 AM',copy:'Antes de cotizar publicidad para tu negocio, conviene tener claras 3 cosas:\n\n1. Dónde se va a colocar.\n2. A qué distancia debe leerse.\n3. Qué acción quieres que genere.\n\nNo es lo mismo imprimir para una fachada, un evento, un punto de venta o una campaña temporal.\n\nEl material, el tamaño y el mensaje deben responder al objetivo.\n\nUna buena cotización empieza con buenas preguntas.'},
      {sem:1,dia:'Jueves',hora:'9:00 AM',copy:'Una marca tiene pocos segundos para ser entendida.\n\nCuando alguien pasa frente a un local, ve una fachada o recibe una promoción, normalmente no se detiene a analizar todo.\n\nPrimero responde tres preguntas:\n\n- ¿Qué es este negocio?\n- ¿Qué ofrece?\n- ¿Por qué debería importarme?\n\nSi la comunicación visual no responde eso rápido, la marca pierde fuerza.\n\nSe trata de crear mensajes visibles, claros y fáciles de recordar.'},
      {sem:2,dia:'Martes',hora:'9:00 AM',copy:'En mercados competitivos, no basta con existir.\n\nUna empresa necesita ser visible, clara y recordable.\n\nLa publicidad visual ayuda a responder tres preguntas en segundos:\n\n- quién eres,\n- qué ofreces,\n- por qué deberían acercarse.\n\nDestacar no siempre significa hacer algo más grande.\n\nA veces significa comunicar mejor.'},
      {sem:2,dia:'Miércoles',hora:'10:00 AM',copy:'Si una empresa quiere ganar visibilidad, puede empezar con tres acciones simples:\n\n1. Revisar si su fachada comunica claramente qué ofrece.\n2. Usar sus espacios físicos como puntos de contacto con el cliente.\n3. Mantener consistencia visual entre promociones, señalética, vehículos y materiales impresos.\n\nLa marca no vive solo en redes sociales.\n\nCuando todo comunica de forma consistente, la empresa se vuelve más fácil de reconocer y recordar.'},
      {sem:2,dia:'Jueves',hora:'9:00 AM',copy:'El punto de venta también comunica.\n\nNo solo vende quien atiende.\n\nTambién venden:\n\n- los menús,\n- las promociones,\n- los cristales,\n- los muros,\n- los exhibidores,\n- la señalética,\n- la fachada.\n\nCada elemento puede ayudar a que el cliente entienda mejor, confíe más y tome una decisión.\n\nLa publicidad visual no debe estar puesta al azar.\n\nDebe tener una función.'},
      {sem:3,dia:'Martes',hora:'9:00 AM',copy:'En un mercado competitivo, una empresa necesita ser fácil de encontrar, entender y recordar.\n\nLa visibilidad no depende solo de estar en redes.\n\nTambién depende de cómo se presenta físicamente:\n\n- su fachada,\n- sus anuncios,\n- sus promociones,\n- sus vehículos,\n- su punto de venta,\n- su señalética.\n\nSi el cliente pasa frente a tu negocio y no entiende qué haces, hay una oportunidad perdida.'},
      {sem:3,dia:'Miércoles',hora:'10:00 AM',copy:'Hay errores visuales que hacen que una marca pierda fuerza:\n\n1. Mensajes demasiado largos.\n2. Letras pequeñas para la distancia.\n3. Colores con poco contraste.\n4. Material incorrecto para exterior.\n5. Promociones sin jerarquía.\n6. Fachadas sin claridad.\n7. Publicidad que no dice qué hacer después.\n\nComunicar mejor también es vender mejor.'},
      {sem:3,dia:'Jueves',hora:'9:00 AM',copy:'Ganar visibilidad no siempre significa hacer el anuncio más grande.\n\nA veces significa hacerlo más claro.\n\nMás directo.\n\nMás fácil de leer.\n\nMás consistente con la marca.\n\nLa buena comunicación visual no grita.\n\nOrdena el mensaje para que la marca sea más fácil de recordar.'},
      {sem:4,dia:'Martes',hora:'9:00 AM',copy:'Si una empresa quiere ganar presencia de marca, puede empezar con acciones concretas:\n\n1. Hacer que su fachada sea clara y visible.\n2. Usar señalética para orientar y comunicar mejor.\n3. Convertir sus vehículos, cristales o muros en puntos de contacto.\n\nNo siempre se necesita una campaña enorme.\n\nA veces se necesita aprovechar mejor los espacios que la empresa ya tiene.'},
      {sem:4,dia:'Miércoles',hora:'10:00 AM',copy:'La publicidad física sigue siendo importante porque acompaña al cliente en el mundo real.\n\nLa ve al pasar por una calle.\nLa ve al entrar a un negocio.\nLa ve en una sucursal.\nLa ve en un vehículo.\nLa ve en una promoción.\n\nY en pocos segundos decide si una marca se percibe clara, confiable y profesional.\n\nPor eso, cada pieza visual debe tener intención.\n\nNo se trata de llenar espacios.\n\nSe trata de comunicar mejor.'},
      {sem:4,dia:'Jueves',hora:'9:00 AM',copy:'Una de las ideas más importantes en publicidad visual es esta:\n\nel cliente no compra solo un producto.\n\nCompra una solución.\n\nUna lona puede resolver visibilidad.\nUn vinil puede mejorar la imagen de un espacio.\nUna señalética puede orientar mejor.\nUna rotulación puede convertir un vehículo en publicidad.\n\nCuando entendemos el objetivo, el producto correcto aparece con más claridad.\n\nPor eso, antes de vender, hay que preguntar.\n\nY antes de imprimir, hay que entender.'}
    ]
  },
  luisdiego: {
    nombre:'Luis Diego', rol:'Técnico-Comercial', color:'#16A34A', emoji:'👨‍🔧', pin:'6254',
    auditoria:{
      diagnostico:'El perfil tiene potencial técnico por el Ing., pero está demasiado breve. Debe convertirse en autoridad técnico-comercial: materiales, instalación, durabilidad, rotulación, gran formato y decisiones que evitan retrabajos.',
      titular:'Ing. Diego Jiménez | Asesor técnico-comercial en publicidad visual, gran formato e instalación publicitaria',
      acercaDe:'Ayudo a empresas a elegir soluciones de publicidad visual que comuniquen mejor y funcionen en el contexto real donde serán instaladas.\n\nMi enfoque combina asesoría comercial con criterio técnico: material adecuado, superficie, durabilidad, legibilidad, instalación y calidad final.\n\nEn Impresionante del Sureste trabajamos con impresión, gran formato, rotulación, materiales para interior/exterior y soluciones visuales para negocios.\n\nSi tu empresa necesita que su publicidad se vea bien y dure lo necesario, puedo ayudarte a revisar la mejor opción antes de producir.',
      experiencia:'- Asesor comercial - Impresionante del Sureste: asesor técnico-comercial en materiales, gran formato, rotulación e instalación.\n- Incluir responsabilidades: levantamiento de necesidades, recomendación de materiales, revisión de uso final, seguimiento de producción e instalación.\n- Agregar ejemplos: exterior, vehículos, punto de venta, fachadas, señalética o materiales rígidos.',
      habilidades:['Gran formato','Materiales gráficos','Instalación publicitaria','Rotulación vehicular','Vinil','Lonas','Impresión digital','Publicidad exterior','Asesoría técnica','Producción gráfica','Calidad de impresión','Durabilidad','Atención a clientes','Ventas técnicas','Comunicación visual'],
      destacados:'1) Post: no todos los materiales sirven para exterior.\n2) Comparativa vinil/lona/rígido.\n3) Video corto de instalación o revisión de material.',
      red:'Conectar con operaciones, flotillas, constructoras, talleres, empresas de servicios, marketing operativo y encargados de mantenimiento.',

      checklist:['Foto de perfil profesional en entorno de trabajo','Banner técnico con servicios y tecnologías de Impresionante','Titular técnico con especialidades específicas','Acerca de enfocado en asesoría técnica','Experiencia con tecnologías y tipos de proyecto','Destacados con guías técnicas','Actividad consistente con contenido educativo','Habilidades técnicas validadas','Recomendaciones de clientes que destaquen criterio técnico','Datos de contacto profesionales y consistentes'],
      reglas:['Contenido técnico diferenciador, no genérico','Explicar conceptos que el cliente necesita saber','Técnico pero accesible, sin jerga excesiva','Incluir datos y especificaciones cuando aplique','Responder preguntas técnicas con profundidad','Usar imágenes de proceso y materiales reales','Evitar contenido promocional disfrazado de técnico']
    },
    posts:[
      {sem:1,dia:'Martes',hora:'9:00 AM',copy:'No todos los materiales sirven para exterior.\n\nAntes de elegir entre lona, vinil, microperforado o material rígido, hay que revisar el contexto:\n\n- sol,\n- lluvia,\n- superficie,\n- tiempo de uso,\n- distancia de lectura,\n- forma de instalación.\n\nEl material correcto no siempre es el más caro.\n\nEs el que resuelve mejor el lugar donde se va a usar.\n\nSi tu publicidad va a estar expuesta al clima, la decisión técnica importa tanto como el diseño.'},
      {sem:1,dia:'Miércoles',hora:'10:00 AM',copy:'Gran formato no significa solo imprimir grande.\n\nTambién implica pensar en:\n\n- legibilidad,\n- distancia,\n- resolución,\n- color,\n- material,\n- instalación,\n- durabilidad.\n\nUna pieza puede verse bien en pantalla y aun así fallar cuando se instala.\n\nPor eso, antes de producir, conviene revisar archivo, medidas, superficie y objetivo.\n\nLa calidad final empieza mucho antes de imprimir.'},
      {sem:1,dia:'Jueves',hora:'9:00 AM',copy:'Antes de imprimir, el archivo también debe revisarse.\n\nUn diseño puede verse bien en pantalla, pero tener problemas al producirse si no cumple con puntos básicos:\n\n- medidas correctas,\n- buena resolución,\n- textos legibles,\n- colores preparados,\n- márgenes seguros,\n- imágenes de calidad,\n- formato adecuado para producción.\n\nCuando el archivo llega listo, se reducen errores, retrasos y retrabajos.\n\nLa calidad final no empieza en la máquina.\n\nEmpieza desde el archivo que se entrega.'},
      {sem:2,dia:'Martes',hora:'9:00 AM',copy:'Vinil, lona o material rígido: no son lo mismo.\n\nCada uno responde a una necesidad distinta.\n\nLa lona suele funcionar bien para comunicación visible, eventos, fachadas temporales o promociones.\n\nEl vinil es útil cuando necesitas adherir la imagen a una superficie: cristal, pared, vehículo o exhibidor.\n\nLos materiales rígidos ayudan cuando se busca mayor presencia, estructura o una imagen más firme y profesional.\n\nAntes de elegir material, hay que entender dónde va a vivir la pieza.'},
      {sem:2,dia:'Miércoles',hora:'10:00 AM',copy:'El vinil no falla solo.\n\nMuchas veces el problema está en la superficie.\n\nAntes de instalar, hay que revisar:\n\n- si está limpia,\n- si tiene polvo,\n- si tiene humedad,\n- si está porosa,\n- si tiene grasa,\n- si recibe mucho sol,\n- si la textura permite adherencia.\n\nUna buena instalación depende tanto del material como de la preparación.\n\nPor eso, cuando se trata de publicidad visual, no basta con imprimir bien.\n\nTambién hay que instalar correctamente.'},
      {sem:2,dia:'Jueves',hora:'9:00 AM',copy:'Un error común en gran formato es diseñar como si todos fueran a verlo de cerca.\n\nPero muchas piezas se leen desde la calle, desde un auto, desde una banqueta o desde varios metros de distancia.\n\nPor eso hay que revisar:\n\n- tamaño de letra,\n- contraste,\n- cantidad de texto,\n- jerarquía del mensaje,\n- ubicación,\n- velocidad con la que pasa el cliente.\n\nEn gran formato, menos texto y más claridad casi siempre funciona mejor.'},
      {sem:3,dia:'Martes',hora:'9:00 AM',copy:'Una buena impresión puede arruinarse con una mala instalación.\n\nAlgunos errores comunes:\n\n- no medir correctamente,\n- no limpiar la superficie,\n- elegir material incorrecto,\n- no considerar clima o exposición,\n- instalar con prisa,\n- no revisar nivelación,\n- no contemplar mantenimiento.\n\nLa instalación es parte del resultado final.\n\nNo es un paso secundario.\n\nCuando una pieza visual queda bien instalada, se ve mejor, dura más y protege la imagen de la marca.'},
      {sem:3,dia:'Miércoles',hora:'10:00 AM',copy:'Un vehículo rotulado puede trabajar como publicidad todos los días.\n\nPero para que funcione bien, hay que cuidar varios puntos:\n\n- diseño legible,\n- datos de contacto claros,\n- material adecuado,\n- preparación de superficie,\n- instalación correcta,\n- ubicación de la información,\n- resistencia al uso diario.\n\nLa rotulación vehicular no es solo poner un logo en una unidad.\n\nEs convertir un vehículo en un medio de visibilidad para la marca.'},
      {sem:3,dia:'Jueves',hora:'9:00 AM',copy:'La publicidad exterior exige más que una buena impresión.\n\nDebe resistir condiciones reales:\n\n- sol,\n- lluvia,\n- polvo,\n- viento,\n- humedad,\n- limpieza,\n- roce,\n- tiempo de exposición.\n\nCuando se elige un material incorrecto, el problema aparece después: decoloración, desprendimiento, desgaste o necesidad de reinstalar.\n\nPor eso conviene pensar en durabilidad desde el inicio.\n\nNo todo material sirve para todo espacio.'},
      {sem:4,dia:'Martes',hora:'9:00 AM',copy:'La calidad de impresión no se mide solo por que "se vea bonito".\n\nTambién se nota en:\n\n- nitidez,\n- color,\n- resolución,\n- material,\n- acabado,\n- resistencia,\n- instalación,\n- consistencia con la marca.\n\nUn archivo puede verse bien en pantalla, pero necesitar ajustes para producirse correctamente.\n\nPor eso es importante revisar medidas, resolución y uso final antes de imprimir.\n\nLa calidad empieza en el archivo y termina en la instalación.'},
      {sem:4,dia:'Miércoles',hora:'10:00 AM',copy:'La durabilidad de una pieza visual no depende solo del material.\n\nTambién depende de:\n\n- dónde se instala,\n- cómo se instala,\n- cuánto sol recibe,\n- si está expuesta a lluvia,\n- si se limpia correctamente,\n- si tiene roce o movimiento,\n- si el material era el adecuado para ese uso.\n\nPensar en durabilidad desde el inicio evita retrabajos y protege la inversión del cliente.'},
      {sem:4,dia:'Jueves',hora:'9:00 AM',copy:'Cuatro semanas hablando de materiales, instalación y publicidad visual.\n\nLo que más se confirma:\n\nLas empresas que piensan antes de imprimir obtienen mejores resultados.\n\nEligen mejor el material.\nRevisan el archivo.\nCuidan la instalación.\nPiensan en durabilidad.\n\nLa diferencia entre un trabajo que dura y uno que hay que repetir casi siempre está en la decisión técnica que se tomó al inicio.\n\nEn Impresionante del Sureste trabajamos así.'}
    ]
  },

    posts:[
      {sem:1,dia:'Martes',hora:'9:00 AM',copy:'Hay negocios que se ven establecidos desde el primer momento.\n\nY hay negocios que, aunque llevan años operando, todavía no transmiten esa solidez.\n\nLa diferencia muchas veces no está en el producto.\n\nEstá en cómo se ve la marca:\n\n- la fachada,\n- el local,\n- los materiales,\n- la señalética,\n- la consistencia visual.\n\nLa primera impresión no ocurre en redes.\n\nOcurre en el mundo físico.\n\nY ahí es donde la publicidad visual hace su trabajo.'},
      {sem:1,dia:'Miércoles',hora:'10:00 AM',copy:'Emprender en el sureste de México tiene sus retos.\n\nUno de ellos es la visibilidad.\n\nNo todos los negocios tienen presupuesto para grandes campañas.\n\nPero todos pueden mejorar cómo se ven.\n\nUna fachada clara. Un letrero legible. Una promoción bien presentada. Materiales consistentes.\n\nNo se necesita invertir en todo al mismo tiempo.\n\nSe puede empezar por lo que más impacto tiene en tu tipo de negocio.\n\nLa visibilidad es un proceso, no un evento.'},
      {sem:1,dia:'Jueves',hora:'9:00 AM',copy:'Cuando un cliente ve tu negocio por primera vez, en segundos decide si entra o sigue de largo.\n\nEsa decisión no está basada solo en el producto.\n\nEstá basada en:\n\n- cómo se ve el lugar,\n- qué tan claro es el mensaje,\n- qué tan profesional parece,\n- si genera confianza o no.\n\nLa publicidad visual es parte de esa primera conversación.\n\nY la primera conversación importa.'},
      {sem:2,dia:'Martes',hora:'9:00 AM',copy:'Una cosa que he aprendido trabajando con negocios del sureste:\n\nno importa el tamaño de la empresa.\n\nImporta qué tan bien comunica lo que hace.\n\nHe visto negocios pequeños que se ven más profesionales que empresas grandes.\n\nY he visto empresas grandes que pierden clientes porque su comunicación visual es confusa o inconsistente.\n\nLa imagen de tu marca es una decisión, no un resultado automático.'},
      {sem:2,dia:'Miércoles',hora:'10:00 AM',copy:'¿Qué hace que un negocio parezca confiable antes de que el cliente hable con alguien?\n\nVarias cosas:\n\n- que su nombre sea visible y claro,\n- que su espacio esté ordenado,\n- que sus materiales estén en buen estado,\n- que haya consistencia entre lo que promete y lo que muestra.\n\nLa confianza se construye en detalles.\n\nY la publicidad visual es uno de esos detalles que muchas veces se descuida.'},
      {sem:2,dia:'Jueves',hora:'9:00 AM',copy:'En Chiapas hay negocios increíbles que nadie conoce.\n\nNo porque no sean buenos.\n\nSino porque no se hacen visibles.\n\nLa visibilidad no es vanidad.\n\nEs parte del proceso de ventas.\n\nSi nadie sabe que existes, nadie puede comprarte.\n\nY si te ven pero no entienden qué haces, tampoco.\n\nUna buena comunicación visual ayuda a resolver ese problema.'},
      {sem:3,dia:'Martes',hora:'9:00 AM',copy:'Hay algo que muchos negocios pasan por alto:\n\nel cliente que ya tienes también necesita ser recordado constantemente de que estás ahí.\n\nLa publicidad visual no es solo para atraer nuevos clientes.\n\nTambién sirve para:\n\n- recordar a clientes actuales que tienes novedades,\n- comunicar promociones en el punto de venta,\n- reforzar la imagen de la marca en cada visita.\n\nLa comunicación visual es parte del servicio, no un extra.'},

var CU=null;
var STK='imp_v5';
function ld(){try{return JSON.parse(localStorage.getItem(STK)||'{}')}catch(e){return{}}}
function sv(d){localStorage.setItem(STK,JSON.stringify(d))}
var ST=ld();
function pk(a,i){return a+'_'+i}
function isD(a,i){return!!ST[pk(a,i)]}
function dAt(a,i){return ST[pk(a,i)]||null}
function tog(a,i){
  var k=pk(a,i);
  if(ST[k])delete ST[k];
  else ST[k]=new Date().toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  sv(ST);
  rAsesor(a,null,true);
}

function toast(m){
  var t=document.getElementById('TOAST');
  t.textContent=m;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2000);
}

}

// ASESOR
function rAsesor(aid,fromSup,keepTab){
  var as=ASESORES[aid];
  if(!as)return;
  var tot=as.posts.length;
  var dn=as.posts.filter(function(_,i){return isD(aid,i)}).length;
  var pct=tot?Math.round((dn/tot)*100):0;

  var curTab='posts';
  if(keepTab){
    var onTab=document.querySelector('.tab.on');
    if(onTab)curTab=onTab.dataset.t||'posts';
  }

  var bk=fromSup||CU==='supervisor'?'<button class="bk" id="BK">&#8592; Volver</button>':'';

  document.getElementById('CONT').innerHTML=
    '<div class="aw">'
    +bk
    +'<div class="ah">'
    +'<div class="aht"><span class="ahe">'+as.emoji+'</span><div><div class="ahn">'+as.nombre+'</div><div class="ahr">'+as.rol+'</div></div></div>'
    +'<div class="ahbw"><div class="ahb"><div class="ahf" style="width:'+pct+'%"></div></div><span class="ahp">'+pct+'%</span><span class="ahc">'+dn+'/'+tot+'</span></div>'
    +'</div>'
    +'<div class="tabs">'
    +'<button class="tab'+(curTab==='posts'?' on':'')+'" data-t="posts">📅 Posts</button>'
    +'<button class="tab'+(curTab==='perfil'?' on':'')+'" data-t="perfil">👤 Perfil</button>'
    +'<button class="tab'+(curTab==='est'?' on':'')+'" data-t="est">⚡ Estrategia</button>'
    +'</div>'
    +'<div id="TC-posts" class="tc'+(curTab==='posts'?' on':'')+'" style="padding:1rem;flex:1;overflow-y:auto">'+bPosts(aid,as)+'</div>'
    +'<div id="TC-perfil" class="tc'+(curTab==='perfil'?' on':'')+'" style="padding:1rem;flex:1;overflow-y:auto">'+bPerfil(as)+'</div>'
    +'<div id="TC-est" class="tc'+(curTab==='est'?' on':'')+'" style="padding:1rem;flex:1;overflow-y:auto">'+bEst()+'</div>'
    +'<div id="TC-msg" class="tc'+(curTab==='msg'?' on':'')+'" style="padding:1rem;flex:1;overflow-y:auto">'+bMensajes(aid)+'</div>'
    +'</div>';

  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      var t=tab.dataset.t;
      document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===tab)});
      ['posts','perfil','est','msg'].forEach(function(x){
        var el=document.getElementById('TC-'+x);
        if(el)el.classList.toggle('on',x===t);
      });
    });
  });

  if(document.getElementById('BK')){
    document.getElementById('BK').addEventListener('click',function(){rSup()});
  }
}

function bPosts(aid,as){
  var sems={};
  as.posts.forEach(function(p,i){if(!sems[p.sem])sems[p.sem]=[];sems[p.sem].push({p:p,i:i})});
  var html='';
  Object.keys(sems).sort(function(a,b){return a-b}).forEach(function(s){
    var posts=sems[s];
    var sd=posts.filter(function(x){return isD(aid,x.i)}).length;
    html+='<div class="wl" style="'+(s>1?'margin-top:1rem':'')+'">Semana '+s+' &nbsp;'+sd+'/'+posts.length+'</div>';
    posts.forEach(function(x){
      var p=x.p,i=x.i;
      var done=isD(aid,i);
      var at=dAt(aid,i);
      var copyId='cp-'+aid+'-'+i;
      var textId='tx-'+aid+'-'+i;
      html+='<div class="pc'+(done?' dn':'')+'" id="PC-'+aid+'-'+i+'">'
        +'<div class="ph">'
        +'<div style="display:flex;gap:.4rem;align-items:center"><span class="pd">'+p.dia+'</span><span class="ps">S'+p.sem+(p.hora?' · '+p.hora:'')+'</span></div>'
        +'<div class="chk" data-aid="'+aid+'" data-idx="'+i+'">'
        +'<svg class="chki" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9 10.5,3"/></svg>'
        +'</div>'
        +'</div>'
        +'<div class="pb">'
        +'<div id="'+textId+'" style="display:none">'+p.copy+'</div>'
        +'<div class="pcp" id="'+copyId+'">'+p.copy.replace(/\n/g,'<br>')+'</div>'
        +'<div class="pax">'
        +'<button class="bex" data-cid="'+copyId+'">ver más ↓</button>'
        +'<button class="bcp" data-tid="'+textId+'">📋 Copiar</button>'
        +(done&&at?'<span class="pda">✓ '+at+'</span>':'')
        +'</div>'
        +'</div>'
        +'</div>';
      html+=(ex.cta?'<div class="cta-blk"><div class="cta-label">CTA</div><div class="cta-text">'+ex.cta+'</div></div>':'');
      html+=(ex.tags&&ex.tags.length?'<div class="tags-blk">'+ex.tags.map(function(t){return'<span class="tag">'+t+'</span>'}).join('')+'</div>':'');
    });
  });
  return html;
}

document.addEventListener('click',function(e){

  // Ver más
  var bex=e.target.closest('.bex');
  if(bex){
    var cid=bex.dataset.cid;
    var el=document.getElementById(cid);
    if(el){el.classList.toggle('op');bex.textContent=el.classList.contains('op')?'ver menos ↑':'ver más ↓'}

  // Copiar post

    var tel=document.getElementById(tid);
